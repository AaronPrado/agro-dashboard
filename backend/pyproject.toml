[project]
name = "agro-dashboard-backend"
version = "0.1.0"
description = "API de dashboard de producción lechera (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "django-environ>=0.11",
    "django-filter>=26.1",
    "djangorestframework>=3.17",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pre-commit>=3.8",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"farms/services/generation.py" = ["S311"]
"farms/services/feeds.py" = ["S311"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
testpaths = ["tests"]
