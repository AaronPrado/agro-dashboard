<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bx { stroke: #55606e; stroke-width: 1.2 }
    .nm { font-size: 13.5px; font-weight: 600; fill: #16202c }
    .sb { font-size: 10.5px; fill: #5f6b78 }
    .ln { fill: none; stroke: #7a8695; stroke-width: 1.4 }
    .xr { fill: none; stroke: #b45309; stroke-width: 1.4; stroke-dasharray: 5 4 }
    .cd { font-size: 10px; fill: #45505c; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round }
    .cx { font-size: 10px; fill: #8a4a08; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round }
    .bd { font-size: 11px; font-weight: 600; fill: #8a94a0; letter-spacing: .08em }
  </style>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text class="bd" x="60" y="26">ANALÍTICA COMPARTIDA Y DESTINOS COMERCIALES</text>
  <text class="bd" x="60" y="346">PROCEDENCIA DE CADA FILA</text>

  <line x1="60" y1="318" x2="940" y2="318" stroke="#e3e7ec" stroke-width="1"/>

  <!-- conectores -->
  <path class="xr" d="M240,64 H290 V116 H340"/>
  <path class="xr" d="M240,184 H290 V132 H340"/>
  <path class="ln" d="M520,124 H620"/>
  <path class="ln" d="M710,148 V260"/>
  <path class="ln" d="M520,284 H620"/>

  <path class="ln" d="M240,412 H290 V384 H340"/>
  <path class="ln" d="M240,436 H290 V464 H340"/>

  <!-- cardinalidades -->
  <text class="cx" x="246" y="56">0..1</text>
  <text class="cx" x="330" y="108">N</text>
  <text class="cx" x="246" y="176">0..1</text>
  <text class="cx" x="330" y="146">N</text>
  <text class="cd" x="527" y="116">N</text>
  <text class="cd" x="605" y="116">1</text>
  <text class="cd" x="717" y="164">1</text>
  <text class="cd" x="717" y="254">N</text>
  <text class="cd" x="527" y="276">1</text>
  <text class="cd" x="605" y="276">N</text>
  <text class="cd" x="247" y="404">1</text>
  <text class="cd" x="330" y="376">N</text>
  <text class="cd" x="247" y="452">1</text>
  <text class="cd" x="330" y="480">N</text>

  <!-- cajas -->
  <g>
    <rect class="bx" x="60" y="40" width="180" height="48" rx="6" fill="#e9f4e7"/>
    <text class="nm" x="150" y="62" text-anchor="middle">NIRAnalysis</text>
    <text class="sb" x="150" y="78" text-anchor="middle">muestra de forraje</text>
  </g>
  <g>
    <rect class="bx" x="60" y="160" width="180" height="48" rx="6" fill="#e4eefb"/>
    <text class="nm" x="150" y="182" text-anchor="middle">BatchMilkSample</text>
    <text class="sb" x="150" y="198" text-anchor="middle">muestra de leche del lote</text>
  </g>
  <g>
    <rect class="bx" x="340" y="100" width="180" height="48" rx="6" fill="#f5f0e4"/>
    <text class="nm" x="430" y="122" text-anchor="middle">AnalysisResult</text>
    <text class="sb" x="430" y="138" text-anchor="middle">un valor medido</text>
  </g>
  <g>
    <rect class="bx" x="620" y="100" width="180" height="48" rx="6" fill="#f5f0e4"/>
    <text class="nm" x="710" y="122" text-anchor="middle">Analyte</text>
    <text class="sb" x="710" y="138" text-anchor="middle">qué se mide · unidad</text>
  </g>
  <g>
    <rect class="bx" x="340" y="260" width="180" height="48" rx="6" fill="#eef0f8"/>
    <text class="nm" x="430" y="282" text-anchor="middle">TargetProfile</text>
    <text class="sb" x="430" y="298" text-anchor="middle">destino comercial</text>
  </g>
  <g>
    <rect class="bx" x="620" y="260" width="180" height="48" rx="6" fill="#eef0f8"/>
    <text class="nm" x="710" y="282" text-anchor="middle">TargetRange</text>
    <text class="sb" x="710" y="298" text-anchor="middle">mínimo / máximo exigido</text>
  </g>

  <g>
    <rect class="bx" x="60" y="400" width="180" height="48" rx="6" fill="#eceff2"/>
    <text class="nm" x="150" y="422" text-anchor="middle">IngestionRun</text>
    <text class="sb" x="150" y="438" text-anchor="middle">una entrega cargada</text>
  </g>
  <g>
    <rect class="bx" x="340" y="360" width="180" height="48" rx="6" fill="#eceff2"/>
    <text class="nm" x="430" y="382" text-anchor="middle">IngestionReject</text>
    <text class="sb" x="430" y="398" text-anchor="middle">línea · contenido · motivo</text>
  </g>
  <g>
    <rect class="bx" x="340" y="440" width="180" height="48" rx="6" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text class="nm" x="430" y="462" text-anchor="middle" fill="#5f6b78">las quince tablas</text>
    <text class="sb" x="430" y="478" text-anchor="middle">con columna de procedencia</text>
  </g>

  <!-- notas -->
  <text x="560" y="392" font-size="11" fill="#5f6b78">Lo que no se pudo interpretar no desaparece:</text>
  <text x="560" y="407" font-size="11" fill="#5f6b78">queda con su motivo y su contenido original.</text>
  <text x="560" y="466" font-size="11" fill="#5f6b78">No es una tabla: representa a las quince que</text>
  <text x="560" y="481" font-size="11" fill="#5f6b78">apuntan a la carga que escribió cada fila.</text>

  <text x="60" y="230" font-size="11" fill="#8a4a08">Un resultado cuelga de una muestra de forraje</text>
  <text x="60" y="245" font-size="11" fill="#8a4a08">o de una de leche, nunca de las dos ni de ninguna.</text>
  <text x="60" y="260" font-size="11" fill="#5f6b78">El mismo par sirve para las dos matrices: por eso</text>
  <text x="60" y="275" font-size="11" fill="#5f6b78">añadir una tercera —el suelo— no es un módulo nuevo.</text>
</svg>
